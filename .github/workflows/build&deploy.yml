name: Build and Test
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v3
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: 21
                cache: maven
            - name: Java and maven version
              run: |
                java -version
                mvn -version
            - name: Build with Maven
              run: mvn clean package
            - name: verify jar file
              run: |
                ls -l target/*.jar
                echo "jar file exists"
            - name: prepare EBS package
              run: |
                mkdir -p eb-deployment
                cp target/*.jar eb-deployment/
                echo "web: java -jar *.jar" > eb-deployment/Procfile
                ls -la eb-deployment
            - name: upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: streamflix-deployment
                path: eb-deployment

    terraform:
        name: Terraform Infra
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: checkout
              uses: actions/checkout@v3
            - name: Configure AWS credentials from OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: us-east-1
                role-session-name: github-OIDC-Role
            - name: Test OIDC authentication
              run: |
                aws sts get-caller-identity
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
            - name: Terraform Init
              working-directory: terraform
              run: terraform init
            - name: Terraform Plan
              working-directory: terraform
              run: terraform plan
            - name: Terraform Apply
              working-directory: terraform
              run: terraform apply -auto-approve
    deploy:
        name: Deploy to AWS Elastic Beanstalk
        runs-on: ubuntu-latest
        needs: terraform
        steps:
            - name: Download Artifact
              uses: actions/download-artifact@v4
              with:
                name: streamflix-deployment
                path: deployment
            - name: Verify Deployment files
              run: |
                  echo "verifying deployment files"
                  la -la deployment
                  echo "verify proc file content"
                  cat deployment/Procfile
                  test -f deployment/Procfile && echo "Procfile exists"
                  test -f deployment/*.jar && echo "jar file exists"
            - name: Create deployment Zip file
              run: |
                    cd deployment
                    zip -r ../streamflixdeployment.zip .
                    cd ..
                    unzip -l streamflixdeployment.zip
            - name: Configure AWS credentials from OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                aws-region: us-east-1
                role-session-name: github-OIDC-Role
            - name: Test OIDC authentication
              run: |
                aws sts get-caller-identity
            - name: Deploy to Elastic Beanstalk
              uses: aws-actions/elastic-beanstalk-deploy@v1
              with:
                application-name: streamflix
                environment-name: streamflix-dev
                version-lable: streanflix-${{ github.run_number}}
                aws-region: us-east-1
                deployment-package-path: streamflixdeployment.zip
